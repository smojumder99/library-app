<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <div class="container">

        <div class="header">
                <h1>Every Book</h1>
        </div>
        







<div class="library-collection">



<button class="add-new-book" command="show-modal" commandfor="book-details-dialog">+ Add new book</button>

    <div class="books">

        
    </div>
    </div>


<dialog id="book-details-dialog">
  <p>Enter details of the book you want to add</p>

  <form action="#" method="post" id="add-book">
    <div>
    <label for="title">Title:</label>
  <input type="text" id="title" name="title" required>
  </div>

  <div>
  <label for="author">Author:</label>
  <input type="text" id="author" name="author" required>
  </div>

  <div>
  <label for="pagecount">No. of pages:</label>
  <input type="number" id="pagecount" name="pagecount" required>
  </div>

<div class="read-status-container">
    <p>Have you read this book?</p>
    <input type="radio" id="read-yes" name="read-status" value="yes" required>
    <label for="read-yes">Yes</label>
    
    <input type="radio" id="read-no" name="read-status" value="no" checked required>
    <label for="read-no">No</label>
  </div>
  </form>

  <div class="dialog-form-buttons">
  <button type="submit" form="add-book" class="form-submit">Add</button>
  <button commandfor="book-details-dialog" command="close">Cancel</button>
  </div>
</dialog>


     <script src="script.js"></script>    
</body>

</html>
